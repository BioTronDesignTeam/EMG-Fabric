; EMG-Fabric prototype firmware
;
;   pio run -e master      build the master
;   pio run -e slave       build the slave (all slaves run the same firmware)
;   pio test -e native     run the unit tests on your laptop
;
; Flash a board: add  -t upload --upload-port <port>
; https://docs.platformio.org/en/latest/projectconf/index.html#projectconf

[platformio]
default_envs = master, slave

; Settings shared by both boards. CHANGE THE BOARD HERE (one place):
;   esp32dev            classic ESP32 DevKit  <- default
;   esp32-s3-devkitc-1  ESP32-S3 (pins switch automatically; not tested yet)
[esp32]
board = esp32dev
; Pinned so the Arduino core (2.0.14) and its timer API don't change under us.
platform = espressif32@6.5.0
framework = arduino
upload_speed = 921600
; The master's USB port carries binary packets only: the Arduino core must
; never print log text on it.
build_flags = -DCORE_DEBUG_LEVEL=0
; Extra warnings for our own code (not the framework's).
build_src_flags = -Wall -Wextra

[env:master]
extends = esp32
build_src_filter = +<master/>

[env:slave]
extends = esp32
build_src_filter = +<slave/>
monitor_speed = 115200
; Some boards (CH340 USB chip) fail to flash at 921600.
upload_speed = 460800
; What the slave samples: 1 = counter test pattern (default), 2 = synthetic EMG noise.
; Uncomment for synthetic EMG, then reflash the slaves:
; build_flags = ${esp32.build_flags} -DSLAVE_MODE=2

; Unit tests for lib/ (the portable code), built with your laptop's compiler.
[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra -Werror -DGOLDEN_FILE=\"$PROJECT_DIR/test/golden/host_packets_v2.txt\"
; The ESP32 compiler uses C++11, so the tests do too.
extra_scripts = pre:scripts/native_cxx11.py
